# Transform for the PD-Flow denoiser: produces (noisy, clean) patch pairs.
# Reads cached clean clouds (npy_cloud loader), normalizes, adds Gaussian noise,
# then crops centred patches -> meta['pc_noisy'] / meta['pc_clean'].

train_transform:
  augments:
    - __target__: sample            # no-op for cached clouds (vertices=None)
      num_samples: 50000
      num_vertex_samples: 1024

    - __target__: normalize_pc

    - __target__: linear            # rotation/scaling augmentation
      scale: [0.8, 1.2]
      rotate_x_range: [-180, 180]
      rotate_y_range: [-180, 180]
      rotate_z_range: [-180, 180]
      scale_p: 0.5
      rotate_p: 0.5

    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020

    - __target__: patch             # crop noisy+clean patch pairs (vm-style)
      patch_size: 1024
      num_patches: 4
      train_cvm_network: False

validate_transform:
  augments:
    - __target__: sample
      num_samples: 50000
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
    - __target__: patch
      patch_size: 1024
      num_patches: 1
      train_cvm_network: False

predict_transform:
  augments:
    - __target__: sample
      num_samples: 50000
      num_vertex_samples: 1024
    - __target__: normalize_pc
