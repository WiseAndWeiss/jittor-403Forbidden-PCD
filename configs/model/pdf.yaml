__target__: PDFlowModule

# ---- invertible flow + latent disentanglement (PD-Flow core idea) ----
# LITE architecture (~170K params): the bigger 672K model overfit (holdout 61 < 68).
# Same loss reaches the same train loss yet generalizes worse -> capacity is
# counterproductive here. Keep lite; push quality via the EMD loss instead.
aug_channel: 33               # augmentation channels (pc 3 + aug 33 = 36, even)
cut_channel: 6                # latent noise subspace zeroed out (fixed binary mask)
num_neighbors: 32             # kNN for graph-conv features
n_injector: 7                 # feature-injection steps
nflow_module: 8               # flow blocks (ActNorm + affine coupling)
feat_dim: 32                  # graph-conv feature width
flow_hidden: 64               # coupling MLP width

# ---- loss: Chamfer (point-point) + point-to-plane (P2S) ----
# Sinkhorn-EMD was tested (ckpt15 holdout 15.7 << lite 68): entropic OT pulls points
# toward blurred barycenters and collapses the distribution -> DROPPED (weight 0).
# Instead: CD = the proven term that got lite to 68 (coverage + CD-half of metric);
# P2P = point-to-plane, targets the untargeted P2S-half (off-surface error only,
# points slide tangentially). Mirrors the 0.5*CD + 0.5*P2S metric.
cd_weight: 1.0
p2p_weight: 5.0              # point-to-plane (P2S proxy); ~balanced vs CD at init
p2p_normal_k: 16            # kNN for local-PCA normal estimation
sinkhorn_weight: 0.0        # EMD disabled (harmful; see above)
sinkhorn_eps: 0.01
sinkhorn_iters: 50

# ---- inference (patch-based) ----
predict_patch_size: 1024
predict_seed_k: 4             # patch overlap factor (more overlap -> better CD coverage)
predict_iters: 2             # iterative denoising passes (PD-LTS-style; big quality win)
predict_patch_step: 16        # patches per forward batch
