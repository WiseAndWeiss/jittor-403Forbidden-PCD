mode: train
debug: False

components:
  data: train_pdf          # cached 50k clouds, NO in-training validation (MPI/BN deadlock)
  transform: pdf
  system: pdf
  model: pdf

loss:
  loss: 1.0                # cd_weight*CD + p2p_weight*P2P (combined in the module)
  cd_loss: 0.0             # logged only
  p2p_loss: 0.0            # logged only (point-to-plane / P2S term)
  emd_loss: 0.0            # logged only (Sinkhorn-EMD term, disabled)

optimizer:
  __target__: adam
  lr: 0.001              # lite model converges + generalizes well at 1e-3
  weight_decay: 0.0      # NEVER use wd on a normalizing flow (breaks invertibility -> score 0)

trainer:
  epochs: 100
  warmup_epochs: 3
  log_interval: 20
  grad_clip: 0.0

wandb:
  enabled: true
  project: pdf-pcdenoise
  name: null
  mode: online
