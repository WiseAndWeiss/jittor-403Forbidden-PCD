mode: train
debug: False

components:
  data: train_asdn
  transform: asdn
  system: classify
  model: classify

loss:
  loss: 1.0
  mse: 0.0

optimizer:
  __target__: adam
  lr: 0.0001
  weight_decay: 0.0

trainer:
  epochs: 200
  warmup_epochs: 5
  log_interval: 20

wandb:
  enabled: true
  project: asdn-pcdenoise
  name: null        # optional; null = auto-generated
  mode: online      # online | offline | disabled
