mode: train
debug: False
load_ckpt: experiments/asdn/checkpoint_140.pkl

components:
  data: train_asdn_noval
  transform: asdn
  system: asdn_v2
  model: asdn_v2

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0002
  weight_decay: 0.0

trainer:
  epochs: 25
  warmup_epochs: 2
  log_interval: 20

wandb:
  enabled: false
  mode: disabled
