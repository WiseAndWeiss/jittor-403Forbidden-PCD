mode: train
debug: False

components:
  data: train_pdlts        # cached 50k clouds, smaller batch (memory)
  transform: pdf
  system: pdlts
  model: pdlts

loss:
  loss: 1.0                # CD (loss_type=cd) or EMD, combined in the module

optimizer:
  __target__: adam
  lr: 0.001              # JFB gradient is approximate -> conservative lr (PD-LTS used 2e-3)
  weight_decay: 0.0      # never wd on a flow

trainer:
  epochs: 100
  warmup_epochs: 3
  log_interval: 20
  grad_clip: 1.0         # JFB + fixed-point can spike; clip for safety

wandb:
  enabled: true
  project: pdlts-pcdenoise
  name: null
  mode: online
