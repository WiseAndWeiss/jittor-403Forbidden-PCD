mode: train
debug: False
load_ckpt: experiments/vm/checkpoint_best.pkl

components:
  data: train_micro
  transform: micro
  system: vm
  model: vm

loss:
  loss: 1.0
  mse_loss: 0.0
  cd_loss: 0.0
  smoothness_loss: 0.0

optimizer:
  __target__: adam
  lr: 0.00005
  weight_decay: 0.00003

trainer:
  epochs: 40
  warmup_epochs: 3
  log_interval: 20
