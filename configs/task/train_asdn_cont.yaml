mode: train
debug: False
load_ckpt: experiments/asdn/checkpoint_281.pkl

components:
  data: train_asdn_noval
  transform: asdn
  system: asdn
  model: asdn

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0003
  weight_decay: 0.0

trainer:
  epochs: 460
  warmup_epochs: 0
  log_interval: 20

wandb:
  enabled: true
  project: asdn-pcdenoise
  name: asdn-base-cont
  mode: online
