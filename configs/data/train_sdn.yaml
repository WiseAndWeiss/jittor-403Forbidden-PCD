data_name: &data_name models/model_normalized.obj
loader: &loader obj

# batch_size = number of *shapes* per step; each shape yields `num_patches`
# patches (see configs/transform/sdn.yaml), so the effective patch batch is
# batch_size * num_patches. Under MPI this is the per-GPU batch size.
train_dataset:
  shuffle: True
  batch_size: 8
  num_workers: 4      # 4/rank (12 total) loads in parallel; high counts (8/rank=24) segfault under MPI
  datapath:
    input_dataset_dir: ./dataset_train
    use_prob: True
    num_files: 10000
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/train.txt, 1.0],
      ]

validate_dataset:
  shuffle: False
  batch_size: 3       # must be >= MPI world_size (3 GPUs); Jittor asserts this
  num_workers: 0
  datapath:
    input_dataset_dir: ./dataset_train
    use_prob: False
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/validate.txt, 1.0],
      ]
