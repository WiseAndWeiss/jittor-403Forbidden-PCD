data_name: &data_name cloud.npy
loader: &loader npy_cloud      # pre-sampled clean clouds (tools/cache_clouds.py)

# Training reads CACHED 50k-point clouds from dataset_cache/ instead of sampling
# meshes every step -> fast epochs + patch density matches the 50k test clouds.
# Build the cache first:  python tools/cache_clouds.py --list datalist/train_sdn.txt
# batch_size = shapes/step; each yields num_patches patches (configs/transform/sdn.yaml).
train_dataset:
  shuffle: True
  batch_size: 8
  num_workers: 0      # Jittor MPI dataloader workers segfault; load in main proc
  datapath:
    input_dataset_dir: ./dataset_cache
    use_prob: True
    num_files: 8000
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/train_sdn.txt, 1.0],
      ]

validate_dataset:
  shuffle: False
  batch_size: 3       # must be >= MPI world_size (3 GPUs)
  num_workers: 0
  datapath:
    input_dataset_dir: ./dataset_cache
    use_prob: False
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/validate.txt, 1.0],
      ]
